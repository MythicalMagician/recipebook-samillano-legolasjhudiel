<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Recipe Book</title>
    <style>
        body {
            list-style-type: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Recipe Book</h1>
    <h2>Recipes</h2>
    <p>
        {% for recipe in recipes %}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </p>
    <img  src="https://i.pinimg.com/736x/7b/d2/4a/7bd24ad2aab61f8c81fb590dbf087cad.jpg"  alt=""  /> 
</body>
</html>
